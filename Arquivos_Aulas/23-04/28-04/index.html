<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>28-04</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1> Formulários HTML</h1>
        <form action="recebe.html"><!--action é o atributo que define para onde os dados devem ser emviados, 
            quando o botão do formulário for clicado. Os métodos de envio são GET e POST, o método GET é usado para enviar
            dados através da URL, enquanto o método POST é usado poara enviar dados através do corpo da requisição HTP.
            O método padrão é GET, esse método são utilizados juntos da linguagem de progamção de lado do servidor, como
             Javascrpit, PHP, Python, etc. -->
            <label for="id_nome"> <!--Label é o elemento que fica acima do input,
             o label define o que deve ser escrito no input-->
                Nome:
            </label>
            <br>
            <input type="text" id="id_nome" name="lnome" value=""> <!-- input é onde os dados serão digitados -->
            <br>
            <br>
            <label for="id_senha"> <!--o for é usado para direcionar ao elememto input, ou seja,
             quando eu clicar no label Senha eu vou para o campo de digitação da senha-->
                senha:
            </label>
            <br>
            <input type="password" id="id-senha" name="lsenha" value="">
            <!-- type é o tipo de dados que vai ser digitado no campo input,
            id é o identificador do campo, name é o nome do campo, value é o valor do campo -->
            <br>
            <br>
            <input type="submit" value="enviar"><!-- o type submit é um botão que envia os
             dados do formulário para o servidor -->



        </form>
        <br>
        <br>

        <p>escolha sua cor favorita!</p>
        <form action="">
            <input type="radio" id="azul" name="cor" value="Azul"><!--o type radio é usado para criar
            opções de escolha, o atributo name define os grupos de opções, ou seja, as opções que possue o mesmo
            name fazem parte do mesmo grupo, e apenas uma opção pode ser relacionada dentro do grupo-->
            <label for="Azul"> Azul</label>
            <br>
            <input type="radio" id="vermelho" name="cor" value="vermelho">
            <label for="vermelho">vermelho</label>
            <br>
            <input type="radio" id="verde" name="cor" value="verde">
            <label for="verde">verde</label>




        </form>
        <br><br>
        <p>escolha seu esporte favorito</p>
        <form action="">
            <input type="checkbox" id="esportes1" name="esporte1" value="Futebol"><!--o type chackbox é usado para criar
            opções de escolha assim como o radio, a diferença é que o checkbox permite selecionar mais de uma opção ao mesmo
            tempo-->
            <label for="esporte1">Futebol</label>
            <input type="checkbox" id="esporte2" name="esporte3" value="Volei">
            <label for="esporte2">Volei</label>
             <input type="checkbox" id="esporte3" name="esporte3" value="Ciclismo">
            <label for="esporte3">Ciclismo</label>


        </form>


    </div>

</body>

</html>
