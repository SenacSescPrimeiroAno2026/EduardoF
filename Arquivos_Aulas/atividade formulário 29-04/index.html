<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Formulário de Cadastro</h1>

    <form action="recebe.html">

        <label>Nome:</label>
        <input type="text">
        <br><br>

        <label>Idade:</label>
        <input type="number">
        <br><br>

        <label>Email:</label>
        <input type="email">
        <br><br>

        <label>Telefone:</label>
        <input type="telefone">
        <br><br>

        <label>Turno:</label>
        <br>
        <input type="radio" name="turno"> Manhã
        <br>
        <input type="radio" name="turno"> Tarde
        <br>
        <input type="radio" name="turno"> Noite
        <br><br>

        <label>Interesses:</label>
        <br>
        <input type="checkbox"> Tecnologia
        <br>
        <input type="checkbox"> Esportes
        <br>
        <input type="checkbox"> Música
        <br>
        <input type="checkbox"> Jogos
        <br><br>

        <input type="checkbox" required> Aceito os termos<br><br>

        <input type="submit" value="Enviar">

    </form>

</body>

</html>
